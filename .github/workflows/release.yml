# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Release on a pushed `v<version>` tag, in three jobs:
#
# 1. check: scripts/verify-release-tag refuses a tag that is not
#    annotated, not signed, not on the checked-out commit, whose message
#    is not exactly `jspassgen-sdk-java v<version>`, or whose version
#    disagrees with pom.xml or any file that restates it. Then the
#    `make check` gate and `make audit`; then `make release-dry-run`
#    (jar, sources and Javadoc jars, the Central bundle; unsigned,
#    nothing uploaded), and SHA256SUMS over the jars.
# 2. publish-central: after a maintainer approves the `maven-central`
#    environment (required reviewer), rebuilds the jars, checks them
#    against SHA256SUMS (the build is reproducible:
#    project.build.outputTimestamp), signs them with GPG and publishes
#    them to Maven Central through the Central Portal plugin. Maven
#    Central has no OIDC trusted publishing, so the Portal user token and
#    the signing key are secrets of that environment. A version already
#    on Central is skipped, so a rerun is safe.
# 3. github-release: a draft GitHub release titled `jspassgen-sdk-java
#    <version>` with the jars and SHA256SUMS attached, and notes with
#    What's Changed, the checksums and the Full Changelog line. The
#    maintainer writes the Highlights and publishes the draft.
#    The release also carries the SLSA build provenance of its files,
#    signed through Sigstore (<project>-<version>.intoto.jsonl).
#
# CI cannot verify the tag's signature (it has no maintainer keys); it
# checks that the tag carries one. Verify it locally with
# `git verify-tag v<version>` (KEYS.asc) before pushing the tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CENTRAL_PATH: com/jspassgen/jspassgen

jobs:
  check:
    name: Check the tag, run the gate, build the jars
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.tag.outputs.version }}
    env:
      OSV_VERSION: v2.7.1
      OSV_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the tag against pom.xml
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # actions/checkout can leave a lightweight copy of the tag;
          # fetch the real tag object.
          git fetch --force origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          scripts/verify-release-tag "$TAG" "$GITHUB_SHA"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Gate (make check)
        run: make check

      - name: Install OSV-Scanner (checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"

      - name: Known vulnerabilities (make audit)
        run: make audit OSV_SCANNER="$RUNNER_TEMP/osv-scanner"

      - name: Release build (unsigned, nothing uploaded)
        run: make release-dry-run

      - name: Jars and SHA256SUMS
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          base="jspassgen-${VERSION}"
          cp "target/${base}.jar" "target/${base}-sources.jar" "target/${base}-javadoc.jar" release/
          (cd release && sha256sum -- *.jar > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish-central:
    name: Publish to Maven Central
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skip a version already on Maven Central
        id: registry
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://repo1.maven.org/maven2/${CENTRAL_PATH}/${VERSION}/")
          if [ "$code" = 200 ]; then
            echo "::notice::${CENTRAL_PATH}/${VERSION} is already on Maven Central; nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Writes settings.xml with the `central` server read from the env
      # vars below, and imports the signing key into a temporary keyring
      # (GNUPGHOME).
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.registry.outputs.published == 'false'
        with:
          distribution: temurin
          java-version: "21"
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.registry.outputs.published == 'false'
        with:
          name: release
          path: release

      - name: Rebuild the jars and check them against SHA256SUMS
        if: steps.registry.outputs.published == 'false'
        run: |
          set -euo pipefail
          ./mvnw -B -Prelease -DskipTests package
          (cd target && sha256sum --check ../release/SHA256SUMS)

      - name: Sign and publish through the Central Portal
        if: steps.registry.outputs.published == 'false'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          ./mvnw -B -Prelease -DskipTests deploy
          # The uploaded jars are the ones in SHA256SUMS.
          (cd target && sha256sum --check ../release/SHA256SUMS)

      - name: Wait until the version is on repo1.maven.org
        if: steps.registry.outputs.published == 'false'
        env:
          VERSION: ${{ needs.check.outputs.version }}
        # The Portal reports "published" before the files reach the
        # Central repository, which can take up to about 30 minutes.
        run: |
          set -euo pipefail
          url="https://repo1.maven.org/maven2/${CENTRAL_PATH}/${VERSION}/jspassgen-${VERSION}.pom"
          for attempt in $(seq 1 45); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = 200 ]; then
              echo "${url} is live."
              exit 0
            fi
            echo "Attempt ${attempt}: not visible yet; retrying in 60s."
            sleep 60
          done
          echo "::warning::The Portal published ${VERSION}, but ${url} is not visible after 45 minutes; check central.sonatype.com before announcing."

  github-release:
    name: Draft the GitHub release
    needs: [check, publish-central]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # sign the build provenance through Sigstore
      attestations: write # store the provenance as a GitHub attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # SLSA build provenance for every release file, signed through
      # Sigstore and stored as a GitHub attestation of this run. Its
      # Sigstore bundle (the signed in-toto statement) is attached as
      # <project>-<version>.intoto.jsonl, so the release carries its own
      # provenance. Check an asset with
      # `gh attestation verify <file> --repo <owner>/<repo>`; add
      # `--bundle <project>-<version>.intoto.jsonl` to check it against
      # the attached bundle.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Attach the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          PROJECT: ${{ github.event.repository.name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: cp "$BUNDLE" "release/${PROJECT}-${VERSION}.intoto.jsonl"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        # The generated notes end with the Full Changelog line; the
        # checksums go just before it, as the release standard orders them.
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/releases/generate-notes" -f tag_name="$TAG" --jq .body > generated.md
          {
            echo "## Highlights ⭐️"
            echo
            grep -v '^\*\*Full Changelog\*\*' generated.md
            echo
            echo "## Checksums"
            echo
            echo "SHA-256 of every asset attached to this release:"
            echo
            echo '```text'
            cat release/SHA256SUMS
            (cd release && sha256sum -- *.intoto.jsonl)
            echo '```'
            echo
            grep '^\*\*Full Changelog\*\*' generated.md || true
          } > notes.md
          gh release create "$TAG" release/* --repo "$REPO" --draft \
            --title "jspassgen-sdk-java ${VERSION}" --notes-file notes.md --verify-tag
